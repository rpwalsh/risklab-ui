name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify UI Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck all packages
        run: npm run typecheck:all

      - name: Test package surfaces
        run: npm run test:all

      - name: Enforce runtime coverage
        run: npm run test:coverage

      - name: Build all publishable packages
        run: npm run build:all

      - name: Verify all package contents
        run: npm run pack:all

      - name: Smoke test packed installs
        run: npm run smoke:install

      - name: Browser tests
        run: npm run test:browser

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - run: |
          for workspace in ui/vanilla packages/ui ui/react ui/vue ui/svelte ui/angular ui/lit ui/solid; do
            npm publish --dry-run --workspace="$workspace"
          done
